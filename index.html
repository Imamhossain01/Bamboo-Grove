<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bamboo Grove Sanctuary — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="grove" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<!-- Ambient Wind Audio -->
<audio id="bg-audio" src="bamboo-wind.mp3" loop preload="auto"></audio>
<!-- Panda Eating Audio (MP3 Setup) -->
<audio id="panda-audio" src="panda-sound.mp3" preload="auto"></audio>

<!-- Custom Bamboo Cursor -->
<div class="cursor" id="cursor" aria-hidden="true">
  <svg viewBox="0 0 54 54" fill="none">
    <g transform="rotate(-38 27 27)">
      <rect x="23" y="6" width="8" height="42" rx="4" fill="#4b9e6b"/>
      <rect x="23" y="6" width="3.4" height="42" rx="1.7" fill="#7fc79a"/>
      <path d="M23 18h8M23 30h8M23 41h8" stroke="#2b6a48" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M27 17c-7-1-11-5-12-10 6-1 11 2 12 10z" fill="#95d5b2"/>
      <path d="M27 27c7-1 11-4 12-9-6-1-11 1-12 9z" fill="#74bf95"/>
    </g>
  </svg>
</div>

<main class="stage">
  <section class="card">
    
    <!-- Top Left: Scrollable Ring Volume & Ambient Button -->
    <div class="ambient-wrapper" id="ambient-wrapper" title="Scroll mouse wheel to adjust volume">
      <svg class="vol-ring" viewBox="0 0 40 40">
        <circle class="vol-ring-bg" cx="20" cy="20" r="18"></circle>
        <circle class="vol-ring-prog" id="vol-ring-prog" cx="20" cy="20" r="18"></circle>
      </svg>
      <button class="audio-toggle ambient-btn" id="ambient-toggle" aria-label="Toggle ambient wind">
        <svg id="ambient-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        <svg id="ambient-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle><line x1="2" y1="2" x2="22" y2="22"></line></svg>
      </button>
    </div>

    <!-- Top Right: Panda Sound Button -->
    <button class="audio-toggle panda-btn" id="panda-toggle" aria-label="Toggle panda sound" title="Panda Interaction Sound">
      <svg id="panda-audio-on" viewBox="0 0 24 24" fill="currentColor"><path d="M4.5,7c-1.4,0-2.5,1.1-2.5,2.5c0,1.4,1.1,2.5,2.5,2.5c0.4,0,0.8-0.1,1.1-0.3C5.1,12.5,5,13.2,5,14c0,3.9,3.1,7,7,7s7-3.1,7-7c0-0.8-0.1-1.5-0.5-2.3C18.7,11.9,19.1,12,19.5,12c1.4,0,2.5-1.1,2.5-2.5C22,8.1,20.9,7,19.5,7c-1.1,0-2,0.6-2.4,1.5C15.8,7.6,14,7,12,7S8.2,7.6,6.9,8.5C6.4,7.6,5.6,7,4.5,7z M9,13c1.1,0,2,0.9,2,2c0,1.1-0.9,2-2,2s-2-0.9-2-2C7,13.9,7.9,13,9,13z M15,13c1.1,0,2,0.9,2,2c0,1.1-0.9,2-2,2s-2-0.9-2-2C13,13.9,13.9,13,15,13z"/></svg>
      <svg id="panda-audio-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M4.5 7a2.5 2.5 0 0 0 0 5c0.4 0 0.8-0.1 1.1-0.3C5.1 12.5 5 13.2 5 14c0 3.9 3.1 7 7 7s7-3.1 7-7c0-0.8-0.1-1.5-0.5-2.3 0.3-0.2 0.7-0.3 1.1-0.3 1.4 0 2.5-1.1 2.5-2.5S20.9 7 19.5 7c-1.1 0-2 0.6-2.4 1.5C15.8 7.6 14 7 12 7S8.2 7.6 6.9 8.5C6.4 7.6 5.6 7 4.5 7z"/><circle cx="9" cy="15" r="2"/><circle cx="15" cy="15" r="2"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
    </button>

    <div class="card-header">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="9.6" y="2" width="4.8" height="20" rx="2.4" fill="#95d5b2"/>
          <path d="M9.6 8h4.8M9.6 14h4.8" stroke="#1b4332" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M12 9C6.8 8.4 4 5.6 3 2c4.4-.6 8.2 1.4 9 7z" fill="#40916c"/>
        </svg>
        <span>Bamboo Grove</span>
      </div>
      <h1>The grove is <em>awake</em></h1>
      <p class="sub">Sign in to check on your sanctuary pandas.</p>
    </div>

    <div class="tabs" id="tabs" role="tablist">
      <div class="slider" aria-hidden="true"></div>
      <button role="tab" id="tab-login" aria-controls="panel-login" aria-selected="true">Sign in</button>
      <button role="tab" id="tab-register" aria-controls="panel-register" aria-selected="false">Create account</button>
    </div>

    <!-- SIGN IN -->
    <form class="panel active" id="panel-login" role="tabpanel" novalidate>
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="email" placeholder="you@grove.co" required>
      </div>
      <div class="field has-toggle">
        <label for="login-pass">Password</label>
        <input id="login-pass" type="password" data-secret autocomplete="current-password" placeholder="Your secret" required>
        <button type="button" class="peek" data-peek="login-pass">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" checked> Keep me in the grove</label>
        <a class="link" href="#" onclick="return false">Forgot password</a>
      </div>
      <button class="submit" type="submit">Sign in</button>
      <p class="foot">New here? <a class="link" href="#" data-goto="register" onclick="return false">Plant an account</a></p>
    </form>

    <!-- REGISTER -->
    <form class="panel" id="panel-register" role="tabpanel" hidden novalidate>
      <div class="field">
        <label for="reg-name">Name</label>
        <input id="reg-name" type="text" autocomplete="name" placeholder="Lin Xiao" required>
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" autocomplete="email" placeholder="you@grove.co" required>
      </div>
      <div class="field has-toggle">
        <label for="reg-pass">Password</label>
        <input id="reg-pass" type="password" data-secret autocomplete="new-password" placeholder="At least 8 characters" required>
        <button type="button" class="peek" data-peek="reg-pass">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="strength" id="strength" data-level="0"><i></i><i></i><i></i><i></i></div>
        <div class="strength-note" id="strength-note">A longer phrase grows a taller stalk.</div>
      </div>
      <div class="field has-toggle">
        <label for="reg-confirm">Repeat password</label>
        <input id="reg-confirm" type="password" data-secret autocomplete="new-password" placeholder="Once more" required>
        <button type="button" class="peek" data-peek="reg-confirm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="terms"> I'll tend the grove kindly</label>
      </div>
      <button class="submit" type="submit">Create account</button>
      <p class="foot">Already tending a plot? <a class="link" href="#" data-goto="login" onclick="return false">Sign in</a></p>
    </form>

    <p class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      The pandas cover their eyes with their paws whenever you type a password.
    </p>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
